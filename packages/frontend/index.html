<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230c0c0e%22/%3E%3Cpath d=%22M9 20v-8m4.7 11V9m4.6 13V10M23 18v-4%22 stroke=%22%23ff6a1a%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS6 Control</title>
    <meta name="theme-color" content="#0c0c0e" />
    <script>
      // Apply persisted theme before React renders to prevent flash
      try {
        var stored = JSON.parse(localStorage.getItem('ts6-ui') || '{}');
        var theme = (stored.state && stored.state.theme) || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
